<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart 4.2: Professional vs. Personal Impact Radar</title>
    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fdfdfd; }
        .chart-container { width: 500px; height: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="radarChart"></canvas>
    </div>

    <script>
        // Data parsed from chart4_2_dual_radar.csv with updated color palette (#c65d3b and #e2b13c)
        const data = {
            labels: ['Knowledge Access', 'Personal Connection', 'Workplace Productivity', 'Communication EQ/IQ', 'Privacy & Security'],
            datasets: [
                {
                    label: 'Professional / Education',
                    data: [89.5, 55.0, 92.4, 62.0, 75.0],
                    backgroundColor: 'rgba(226, 177, 60, 0.25)',
                    borderColor: '#e2b13c',
                    borderWidth: 2.5,
                    pointBackgroundColor: '#e2b13c',
                },
                {
                    label: 'Personal / Lifestyle',
                    data: [86.7, 87.8, 51.4, 47.6, 45.5],
                    backgroundColor: 'rgba(198, 93, 59, 0.25)',
                    borderColor: '#c65d3b',
                    borderWidth: 2.5,
                    pointBackgroundColor: '#c65d3b',
                }
            ]
        };

        const config = {
            type: 'radar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { display: true, color: '#e0e0e0' },
                        grid: { color: '#e0e0e0' },
                        suggestedMin: 0,
                        suggestedMax: 100,
                        ticks: { stepSize: 20, font: { size: 10 } },
                        pointLabels: {
                            font: { size: 11, weight: 'bold' },
                            color: '#333'
                        }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Perceived Digital Communication Impact Dimensions',
                        font: { size: 14, weight: 'bold' }
                    },
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        };

        const radarChart = new Chart(
            document.getElementById('radarChart'),
            config
        );
    </script>
</body>
</html>
